name: Build FlexBoard Pro — Signed Release Only

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        working-directory: flexboard-pro
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      # ── Keystore verification ──────────────────────────────────────────────
      # Unsigned or debug APKs are NOT built. If the keystore secret is missing
      # the job fails here with a clear message — no silent fallback to debug.
      - name: Verify release keystore secrets are configured
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ] || \
             [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ] || \
             [ -z "${{ secrets.KEY_ALIAS }}" ] || \
             [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "::error::One or more keystore secrets are missing."
            echo "::error::Set KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD in GitHub → Settings → Secrets → Actions."
            exit 1
          fi

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        working-directory: flexboard-pro
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/flexboard-release.jks

      # ── Signed release build ───────────────────────────────────────────────
      - name: Build Signed Release APK
        working-directory: flexboard-pro
        env:
          KEYSTORE_PATH: keystore/flexboard-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      # ── Publish to repo root ───────────────────────────────────────────────
      - name: Copy Signed Release APK to repo root
        run: |
          cp flexboard-pro/app/build/outputs/apk/release/*.apk ./FlexBoardPro-release.apk
          echo "APK size: $(du -sh FlexBoardPro-release.apk | cut -f1)"

      - name: Commit and push signed release APK
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add FlexBoardPro-release.apk
          git diff --cached --quiet && echo "No APK changes to commit" || \
            git commit -m "release: signed FlexBoardPro-release.apk [skip ci]"
          git push

      # ── Cleanup ────────────────────────────────────────────────────────────
      - name: Delete keystore from runner
        if: always()
        working-directory: flexboard-pro
        run: rm -f keystore/flexboard-release.jks || true
        
